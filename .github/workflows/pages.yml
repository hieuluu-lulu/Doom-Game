# Publishes dist/ (the built game: dist/index.html + dist/assets/, committed by `python3 build.py`)
# to GitHub Pages on every push to main. No build here — the page is prebuilt.
# One-time setup by the repo owner: Settings → Pages → Source: GitHub Actions
# (and, on a free plan, the repository must be public).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
